<style>
:root{--bg:#f1f0e8;--ink:#1f2a26;--mute:#66726c;--line:#c9cdc0;--acc:#6f8f2f;--ph:#e1e3d6;
--serif:"Fraunces","Noto Serif Thai",Georgia,serif;--sans:"Sarabun",system-ui,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171c19;--ink:#e8ebe0;--mute:#98a39b;--line:#323b36;--acc:#a8c75a;--ph:#222a26}}
:root[data-theme="dark"]{--bg:#171c19;--ink:#e8ebe0;--mute:#98a39b;--line:#323b36;--acc:#a8c75a;--ph:#222a26}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 var(--sans);overflow-x:hidden}
a{color:inherit}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:18px 5vw;border-bottom:1px solid var(--line)}
.logo{font:italic 400 26px var(--serif);text-decoration:none;letter-spacing:.02em}
.logo b{color:var(--acc);font-style:normal}
nav{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
nav a,.lang button{font:500 14px var(--sans);text-decoration:none;padding:10px 12px;min-height:44px;display:inline-flex;align-items:center;border:0;background:none;color:var(--mute);cursor:pointer}
nav a.on{color:var(--ink);box-shadow:inset 0 -2px var(--acc)}
.lang{margin-left:8px;border:1px solid var(--line);display:flex}
.lang button.on{background:var(--ink);color:var(--bg)}
main{max-width:1040px;margin:0 auto;padding:48px 5vw 72px}
h1,h2,h3{font-family:var(--serif);font-weight:400;line-height:1.2;margin:0}
h1{font-size:clamp(48px,11vw,104px);letter-spacing:-.02em}
h1 i{color:var(--acc)}
h2{font-size:clamp(28px,5vw,40px);margin-bottom:6px}
.eyebrow{font:500 12px var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--acc)}
.sub{color:var(--mute);max-width:56ch}

   line  = base + sum(add-ons) + usage
   add-on: fixed = price | per = price x qty | pct = base x price / 100

  (c.opts||[]).filter(x=>x.on&&ln.o&&ln.o[x.id]).forEach(x=>{const p=GT.num(x.price);
   if(p==null){o.rows.push({id:x.id,type:x.type,tbd:true});o.tbd.push("opt:"+x.id);return}
   const q=x.type=="per"?GT.int(ln.o[x.id],1,GT.cap(x.max)):1,amt=GT.r2(x.type=="pct"?base*p/100:x.type=="per"?p*q:p);

   else{const amt=GT.r2(u.type=="pct"?base*v/100:v);o.use={id:u.id,type:u.type,v,amt};sub+=amt}}

function publish(){ask("เผยแพร่การเปลี่ยนแปลงไปยังหน้า Public?",pub2)}async function pub2(){try{if(!SB)throw new Error("ยังไม่ได้ตั้งค่า Supabase");const{error}=await SB.from("site_content").upsert({id:"main",data:S,updated_at:new Date().toISOString()});if(error)throw error;PUBJ=JSON.stringify(S);PUB=JSON.parse(PUBJ);ls.d(LK);DRAFT=false;render();toast("เผยแพร่แล้ว")}catch(e){toast("เผยแพร่ไม่สำเร็จ: "+(e.message||e.code||e))}}
function render(){const h=location.hash.replace(/^#\/?/,"").split("/")[0];document.documentElement.lang=lang;apply();
 $("#logo").innerHTML=esc(S.name).replace(/^(\w{3})(\w*)(.*)$/,"$1<b>$2</b><span class=\"lc\">$3</span>");
 const r=R.find(x=>x[0]===h);ADM=h==="admin"&&CAN;
 $("#app").innerHTML=ADM?adm():(h==="admin"?loginView():P[(r||R[0])[1]]());anim((r||R[0])[1]);
 $("#nav").innerHTML=R.slice(1).map(x=>`<a href="#/${x[0]}" class="${x===r?"on":""}">${t(x[2])}</a>`).join("");
 document.title=S.name+" — "+t((r||R[0])[2]);tools();foot();drawModal();}
function keep(f){const y=scrollY;f();render();scrollTo(0,y)}
document.addEventListener("click",e=>{const g=x=>e.target.closest(x);let b;if(b=g("[data-cal]")){calNav(b.dataset.cal);return}
 
 if(b=g("[data-tab]")){TAB=b.dataset.tab;render()}
 if(b=g("[data-copy]")){const v=S.contacts[b.dataset.copy].value;(navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(()=>toast(t("copied"))).catch(()=>toast(v))}
 if(b=g("[data-a]")){const a=b.dataset.a,arr=b.dataset.arr,i=+b.dataset.i,X=arr&&(get(arr)||(set(arr,[]),get(arr)));
  if(a=="add")keep(()=>{X.push({categories:{id:"c"+Date.now(),img:"",name:{th:"",en:""},price:{th:"",en:""},desc:{th:"",en:""},inc:{th:"",en:""},add:{th:"",en:""},state:"open",base:"",opts:[]},contacts:{label:"",value:"",url:""},queue:{id:"#GT"+String(X.length+1).padStart(3,"0"),label:"",type:"",st:"waiting",start:"",due:"",note:"",priv:"",pub:0,upd:new Date().toISOString().slice(0,10)},blocks:{from:"",to:"",label:""},links:{label:"",url:"",show:1},events:{id:"ev"+Date.now(),label:"",from:"",to:"",qid:"",pub:1,note:""},works:{img:"",title:"",desc:""},opts:{id:"o"+Date.now(),th:"",en:"",type:"fixed",price:"",on:1},usage:{id:"u"+Date.now(),th:"",en:"",type:"fixed",val:"",on:1}}[arr.split(".").pop()]);dirty()});
  if(a=="del")ask("ลบรายการนี้?",()=>keep(()=>{X.splice(i,1);dirty()}));
  if(a=="up"&&i>0)keep(()=>{[X[i-1],X[i]]=[X[i],X[i-1]];dirty()});
  if(a=="dn"&&i<X.length-1)keep(()=>{[X[i+1],X[i]]=[X[i],X[i+1]];dirty()});
  if(a=="save"){dirty();toast("บันทึกร่างในอุปกรณ์นี้แล้ว")}
  if(a=="prev")location.hash="#/";
  if(a=="out"){SB.auth.signOut().then(()=>{CAN=false;S=JSON.parse(PUBJ);norm();DRAFT=false;location.hash="#/";render()})}
  if(a=="pub")publish();
  if(a=="disc")ask("ทิ้งร่างและกลับไปใช้เวอร์ชันที่เผยแพร่?",()=>{ls.d(LK);S=JSON.parse(PUBJ);norm();DRAFT=false;render()});
  
  if(a=="exp"){const u=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:"application/json"})),l=document.createElement("a");l.href=u;l.download="gintonic-backup.json";l.click()}}});
document.addEventListener("input",e=>{const x=e.target;if(x.dataset.qf!==undefined){QF=x.value;render();return}
 if(x.dataset.p){const v=x.type=="number"||x.type=="range"?(x.value===""?"":+x.value):x.value;if(/^queue\.(\d+)\.(st|due|moved|note)$/.test(x.dataset.p))S.queue[RegExp.$1].upd=TD();set(x.dataset.p,v);
  if(x.type=="color"){const h=document.querySelector('[data-hex="'+x.dataset.p+'"]');if(h)h.value=x.value}
  if(["status.k","effect.type","fh","fb"].includes(x.dataset.p)||/queue\.\d+\.chan$/.test(x.dataset.p)||/\.opts\.\d+\.type$/.test(x.dataset.p))render()}
 if(x.dataset.hex&&/^#[0-9a-f]{6}$/i.test(x.value)){set(x.dataset.hex,x.value.toLowerCase());const q=document.querySelector('[data-p="'+x.dataset.hex+'"]');if(q)q.value=x.value.toLowerCase()}
 if(x.dataset.c)set(x.dataset.c,x.checked?1:0)});
document.addEventListener("click",e=>{let b=e.target.closest("[data-seg]");if(b){const i=b.dataset.seg.indexOf(":");set(b.dataset.seg.slice(0,i),b.dataset.seg.slice(i+1));render();return}
 b=e.target.closest("[data-ap]");if(b){if(b.dataset.ap=="reset")ask("คืนค่าหน้าตาเริ่มต้น?",()=>{S.ap={...AP0};S.font="editorial";dirty();render()});else ask("รีเซ็ตเอฟเฟกต์พื้นหลัง?",()=>{S.effect={...FX0};dirty();render()})}
 if(e.target.closest("[data-sndtest]"))ls.g("gt-snd")==="1"?snd("ok"):toast("เปิดปุ่มเสียงที่ส่วนหัวก่อน")});
document.addEventListener("change",e=>{if(e.target.id!="pngup")return;const f=e.target.files[0];if(!f)return;if(f.type!="image/png")return toast("อัปโหลดไม่สำเร็จ: ไม่ใช่ไฟล์ PNG");if(f.size>307200)return toast("อัปโหลดไม่สำเร็จ: ไฟล์ใหญ่เกิน 300 KB");
 const r=new FileReader();r.onerror=()=>toast("อัปโหลดไม่สำเร็จ: อ่านไฟล์ไม่ได้");r.onload=()=>{const im=new Image();im.onerror=()=>toast("อัปโหลดไม่สำเร็จ: ไฟล์ภาพไม่ถูกต้อง");im.onload=()=>{S.effect.png=r.result;S.effect.type="png";dirty();render()};im.src=r.result};r.readAsDataURL(f)});
document.addEventListener("change",e=>{if(e.target.id!="imp")return;const f=e.target.files[0];if(!f)return;f.text().then(j=>{try{const d=JSON.parse(j);if(!d.categories||!d.tos||!d.contacts||!Array.isArray(d.queue))throw 0;ask("เขียนทับร่างปัจจุบันด้วยข้อมูลที่นำเข้า?",()=>{S={...PUB,...d};norm();dirty();render()})}catch(_){toast("ไฟล์สำรองไม่ถูกต้อง")}})});
addEventListener("hashchange",render);
/* ---------- Effects ---------- */
let raf=0,FXI=null,FXP=[],FXT="";
function fx(){const c=$("#fx"),e=S.effect;if(!c.getContext)return;if(matchMedia("(prefers-reduced-motion:reduce)").matches||e.type=="none"){cancelAnimationFrame(raf);raf=0;FXP=[];c.getContext("2d").clearRect(0,0,c.width,c.height);return}
 if(raf)return;const x=c.getContext("2d");let last=performance.now();
 (function f(now){raf=requestAnimationFrame(f);const E=S.effect;if(E.type=="none"){fx();return}if(document.hidden){last=now;return}
  const w=innerWidth,h=innerHeight,dt=Math.min(.05,(now-last)/1000);last=now;if(c.width!=w)c.width=w;if(c.height!=h)c.height=h;
  if(FXT!==E.type+E.png.length){FXT=E.type+E.png.length;FXP=[];FXI=null}if(E.type=="png"&&E.png&&!FXI){FXI=new Image();FXI.src=E.png}
  const max=Math.round(E.density*(w<760?.6:1));if(FXP.length<max&&Math.random()<E.freq*dt*8)FXP.push({k:Math.floor(Math.random()*3),d:Math.random(),x:Math.random()*w,y:-30,s:.6+Math.random()*.8,v:.6+Math.random()*.8,o:Math.random()*6,r:Math.random()*6.3,w:(Math.random()-.5)*1.2});
  x.clearRect(0,0,w,h);x.globalAlpha=E.op;
  FXP=FXP.filter(p=>{p.y+=p.v*E.speed*60*dt*(E.type=="snow"?.6+p.d*.8:1);p.x+=Math.sin(now/900+p.o)*20*dt*E.speed;p.r+=p.w*dt;if(p.y>h+40)return false;const z=(E.type=="png"?28:4)*E.size*p.s;
   if(E.type=="snow"){const q=z*4.5*(.6+p.d*.8);x.globalAlpha=E.op*(.45+.55*p.d);x.save();x.translate(p.x,p.y);x.rotate(p.r);x.drawImage(FL[p.k],-q/2,-q/2,q,q);x.restore();x.globalAlpha=E.op}
   else if(FXI&&FXI.complete&&FXI.naturalWidth){x.save();x.translate(p.x,p.y);x.rotate(p.r);x.drawImage(FXI,-z/2,-z/2,z,z*FXI.naturalHeight/FXI.naturalWidth);x.restore()}return true});x.globalAlpha=1})(last)}
/* ---------- Boot ---------- */
(async()=>{try{await loadRemote();norm();render()}catch(e){window.__plHide&&__plHide();throw e}if(!/^#\/admin/.test(location.hash))window.__plHide&&__plHide();try{CAN=await AUTH.isAdmin();if(CAN){loadDraft();render()}}catch(_){}window.__plHide&&__plHide()})();
